runConfig:
  cpu: 1
  memoryMiB: 512
  maxInstances: 10

scripts:
  runCommand: node index.js

env:
  - variable: SMTP_HOST
    value: smtp.ionos.fr
    availability: [RUNTIME]
  - variable: SMTP_PORT
    value: "465"
    availability: [RUNTIME]
  - variable: SMTP_SECURE
    value: "true"
    availability: [RUNTIME]
  - variable: SMTP_USER
    secret: SMTP_USER
    availability: [RUNTIME]
  - variable: SMTP_PASSWORD
    secret: SMTP_PASSWORD
    availability: [RUNTIME]
