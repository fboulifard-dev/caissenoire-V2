runConfig:
  cpu: 1
  memoryMiB: 512
  maxInstances: 10

scripts:
  runCommand: node index.js

env:
  - variable: NODE_ENV
    value: recette
  - variable: APP_URL
    value: https://rec-asptt.fboulifard.com
  - variable: SMTP_HOST
    value: smtp.ionos.fr
  - variable: SMTP_PORT
    value: "465"
  - variable: SMTP_FROM
    value: Caisse Noire <no-reply@fboulifard.com>
  - variable: SMTP_USER
    secret: SMTP_USER
  - variable: SMTP_PASSWORD
    secret: SMTP_PASSWORD
