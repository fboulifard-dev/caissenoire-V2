<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button [defaultHref]="seasonId ? '/saisons/' + seasonId : '/saisons'"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ seasonYear ? 'Paiements - ' + seasonYear : 'Paiements' }}</ion-title>
    
  </ion-toolbar>
</ion-header>

<ion-content>

  <div *ngIf="!loading">
    <section *ngFor="let group of paymentGroups" class="date-group">
      <h2 class="date-group-title">{{ group.label }}</h2>
      <ion-list>
        <ion-item-sliding *ngFor="let p of group.items">
          <ion-item class="list-card">
            <ion-thumbnail slot="start" *ngIf="p.imageData">
              <img [src]="p.imageData" alt="Justificatif du paiement" />
            </ion-thumbnail>
            <ion-label>
              <h3>{{ p.playerName || p.playerId || 'Inconnu' }}</h3>
              <p *ngIf="p.comment">{{ p.comment || '' }}</p>
            </ion-label>
            <ion-note slot="end">{{ (p.amount || 0) | currency:'EUR':'symbol':'1.0-0' }}</ion-note>
          </ion-item>
          <ion-item-options side="start">
            <ion-item-option color="danger" (click)="deletePayment(p)" [disabled]="readOnly" aria-label="Supprimer le paiement">
              <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
            </ion-item-option>
          </ion-item-options>
          <ion-item-options side="end">
            <ion-item-option color="primary" (click)="editPayment(p)" [disabled]="readOnly" aria-label="Modifier le paiement">
              <ion-icon name="create-outline" slot="icon-only"></ion-icon>
            </ion-item-option>
          </ion-item-options>
        </ion-item-sliding>
      </ion-list>
    </section>
  </div>
  <ion-list *ngIf="loading" class="list-skeleton" aria-label="Chargement des paiements">
    <ion-item *ngFor="let item of [1, 2, 3, 4, 5]">
      <ion-thumbnail slot="start">
        <ion-skeleton-text [animated]="true"></ion-skeleton-text>
      </ion-thumbnail>
      <ion-label>
        <h2><ion-skeleton-text [animated]="true" style="width: 45%"></ion-skeleton-text></h2>
        <p><ion-skeleton-text [animated]="true" style="width: 85%"></ion-skeleton-text></p>
      </ion-label>
      <ion-note slot="end"><ion-skeleton-text [animated]="true" style="width: 58px"></ion-skeleton-text></ion-note>
    </ion-item>
  </ion-list>
    <section style="height: 150px;"></section>

  <ion-fab slot="fixed" vertical="bottom" horizontal="center">
    <ion-fab-button *ngIf="!readOnly" [routerLink]="seasonId ? ['/saisons', seasonId, 'operation', 'paiements', 'create'] : null" aria-label="Créer un paiement">
      <ion-icon name="add" ></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
