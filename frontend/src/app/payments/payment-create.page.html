<ion-content class="operation-form-content">
  <main class="operation-form-shell">
    <header class="operation-form-heading">
      <h1>{{ editing ? 'Modifier le paiement' : 'Nouveau paiement' }}</h1>
    </header>

    <form #paymentForm="ngForm" (ngSubmit)="submit()">
      <h2 class="operation-section-title">Informations</h2>
      <ion-list class="operation-fields">
      <ion-item>
        <ion-icon name="calendar-outline" slot="start"></ion-icon>
        <ion-input
          type="date"
          label="Date"
          labelPlacement="stacked"
          name="date"
          [(ngModel)]="payment.date"
          placeholder="Date"
          required>
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-icon name="cash-outline" slot="start"></ion-icon>
        <ion-input
          type="text"
          inputmode="decimal"
          label="Montant"
          labelPlacement="stacked"
          name="amount"
          min="0"
          [(ngModel)]="payment.amount"
          required
          placeholder="Montant">
        </ion-input>
        <ion-label slot="end">€</ion-label>
      </ion-item>

      <ion-item>
        <ion-icon name="person-outline" slot="start"></ion-icon>
        <ion-select
          label="Joueur"
          labelPlacement="stacked"
          name="playerId"
          [(ngModel)]="payment.playerId"
          placeholder="Sélectionnez un joueur"
          required
          interface="popover">
          <ion-select-option *ngFor="let user of users" [value]="user.id">
            {{ user.firstName || user.lastName ? (user.firstName + ' ' + user.lastName) : (user.name || user.email || user.id) }}
          </ion-select-option>
        </ion-select>
      </ion-item>

      <ion-item>
        <ion-textarea
          label="Commentaire"
          labelPlacement="stacked"
          name="comment"
          [(ngModel)]="payment.comment">
        </ion-textarea>
      </ion-item>

      </ion-list>

    <ion-text color="danger" *ngIf="error" role="alert">
      <p>{{ error }}</p>
    </ion-text>

    <div class="operation-actions">
      <ion-button
        class="operation-cancel"
        fill="outline"
        type="button"
        [routerLink]="['/saisons', seasonId, 'operation', 'paiements']"
        [disabled]="saving">
        Annuler
      </ion-button>
      <ion-button
        *ngIf="isAdmin"
        class="operation-submit"
        expand="block"
        type="submit"
        [disabled]="paymentForm.invalid || saving">
        <ion-spinner *ngIf="saving" name="crescent"></ion-spinner>
        <span *ngIf="!saving">{{ editing ? 'Enregistrer les modifications' : 'Enregistrer le paiement' }}</span>
      </ion-button>
    </div>
    </form>
  </main>
</ion-content>
