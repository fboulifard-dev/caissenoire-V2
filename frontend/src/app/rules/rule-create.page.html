<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button [defaultHref]="seasonId ? '/saisons/' + seasonId + '/regles' : '/saisons'"></ion-back-button>
    </ion-buttons>
    <ion-title>Nouvelle règle</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form #ruleForm="ngForm" (ngSubmit)="submit()">
    <ion-list>
      <ion-item>
        <ion-input
          label="Libellé"
          labelPlacement="stacked"
          name="label"
          [(ngModel)]="rule.label"
          required>
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          type="number"
          label="Montant"
          labelPlacement="stacked"
          name="cost"
          [(ngModel)]="rule.cost"
          min="0"
          required>
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-toggle [(ngModel)]="rule.matchDay" name="matchDay">Jour de match</ion-toggle>
      </ion-item>
    </ion-list>

    <ion-text color="danger" *ngIf="error">
      <p>{{ error }}</p>
    </ion-text>

    <ion-button expand="block" type="submit" [disabled]="saving || !rule.label.trim() || rule.cost < 0">
      {{ saving ? 'Création...' : 'Créer' }}
    </ion-button>
  </form>
</ion-content>
