<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button [defaultHref]="seasonId ? '/saisons/' + seasonId : null"></ion-back-button>
    </ion-buttons>
    <ion-title>Règles</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list *ngIf="!loading">
    <ion-item *ngFor="let rule of rules">
      <ion-label><h2>{{ rule.label }}</h2><p>{{ rule.cost | number:'1.0-0' }} EUR{{ rule.matchDay ? ' - jour de match' : '' }}</p></ion-label>
      <ion-badge slot="end" color="medium" *ngIf="rule.active === false">Désactivée</ion-badge>
      <ion-badge slot="end" color="medium" *ngIf="rule.active === true">Activée</ion-badge>

      <ion-button slot="end" fill="clear" color="success" *ngIf="isAdmin && rule.active === false" (click)="enableRule(rule)" aria-label="Réactiver la règle">
        <ion-icon name="play-outline" slot="icon-only"></ion-icon>
      </ion-button>
      <ion-button slot="end" fill="clear" color="danger" *ngIf="isAdmin && rule.active !== false" (click)="disableRule(rule)" aria-label="Désactiver la règle">
        <ion-icon name="pause-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
  <ion-list *ngIf="loading" class="list-skeleton" aria-label="Chargement des règles">
    <ion-item *ngFor="let item of [1, 2, 3, 4, 5]">
      <ion-label>
        <h2><ion-skeleton-text [animated]="true" style="width: 65%"></ion-skeleton-text></h2>
        <p><ion-skeleton-text [animated]="true" style="width: 35%"></ion-skeleton-text></p>
      </ion-label>
      <ion-skeleton-text slot="end" [animated]="true" style="width: 72px"></ion-skeleton-text>
    </ion-item>
  </ion-list>
  <section style="height: 150px;"></section>

  <ion-fab slot="fixed" vertical="bottom" horizontal="center">
    <ion-fab-button *ngIf="isAdmin" [routerLink]="seasonId ? ['/saisons', seasonId, 'regles', 'create'] : null" aria-label="Créer une règle">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
