<ion-content class="auth-content">
  <main class="auth-shell">
    <nav class="auth-topbar" aria-label="Navigation du compte">
      <span>Nouveau ?</span>
      <ion-button fill="clear" routerLink="/signup">Créer un compte</ion-button>
    </nav>

    <header class="auth-brand">
      <img class="auth-logo" src="assets/image/logo-asptt-grande.png" alt="ASPTT Nantes Handball" />
      <div>
        <span>ASPTT NANTES HB</span>
        <strong>CAISSE NOIRE</strong>
      </div>
    </header>

    <section class="auth-form">
      <div class="auth-intro">
        <h1>Connexion</h1>
      </div>

      <ion-text color="success" *ngIf="verificationMessage">
        <p class="reset-message" role="status">{{ verificationMessage }}</p>
      </ion-text>
      <ion-text color="danger" *ngIf="verificationError">
        <p class="reset-message" role="alert">{{ verificationError }}</p>
      </ion-text>
      <ion-button *ngIf="unverifiedAccount" fill="clear" expand="block" (click)="resendVerificationEmail()" [disabled]="loading">
        Renvoyer l’email de vérification
      </ion-button>

      <form (ngSubmit)="signInEmail()">
      <div class="auth-fields">
        <ion-item>
          <ion-icon name="person-outline" slot="start" aria-hidden="true"></ion-icon>
          <ion-input type="email" name="email" [(ngModel)]="email" placeholder="Email" autocomplete="email" enterkeyhint="send"></ion-input>
        </ion-item>

        <ion-item>
          <ion-icon name="lock-closed-outline" slot="start" aria-hidden="true"></ion-icon>
          <ion-input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password" placeholder="Mot de passe" autocomplete="current-password" enterkeyhint="send"></ion-input>
          <ion-button slot="end" fill="clear" type="button" [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'" [attr.aria-pressed]="showPassword" (click)="showPassword = !showPassword">
            <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </ion-button>
        </ion-item>
      </div>

      <ion-button class="auth-primary" expand="block" type="submit" [disabled]="loading || !canSignInEmail">
        <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
        <span *ngIf="!loading">Se connecter</span>
      </ion-button>
      </form>
      <ion-button class="auth-text-button" fill="clear" expand="block" routerLink="/forgot-password" [state]="{ email: email }" [disabled]="loading">
        Mot de passe oublié ?
      </ion-button>

      <div class="auth-divider"><span>ou</span></div>
      <ion-button class="auth-provider" expand="block" fill="outline" (click)="signInGoogle()" [disabled]="loading">
        <ion-icon slot="start" name="logo-google"></ion-icon>
        Continuer avec Google
      </ion-button>
    </section>

  </main>
</ion-content>
