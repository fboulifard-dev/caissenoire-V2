<div class="password-requirements" role="list" aria-label="Règles du mot de passe">
  <p [class.met]="requirements.minimumLength" role="listitem">
    <ion-icon [name]="requirements.minimumLength ? 'checkmark-circle' : 'ellipse-outline'" aria-hidden="true"></ion-icon>
    Au moins 10 caractères
  </p>
  <p [class.met]="requirements.uppercase" role="listitem">
    <ion-icon [name]="requirements.uppercase ? 'checkmark-circle' : 'ellipse-outline'" aria-hidden="true"></ion-icon>
    Une lettre majuscule
  </p>
  <p [class.met]="requirements.lowercase" role="listitem">
    <ion-icon [name]="requirements.lowercase ? 'checkmark-circle' : 'ellipse-outline'" aria-hidden="true"></ion-icon>
    Une lettre minuscule
  </p>
  <p [class.met]="requirements.number" role="listitem">
    <ion-icon [name]="requirements.number ? 'checkmark-circle' : 'ellipse-outline'" aria-hidden="true"></ion-icon>
    Un chiffre
  </p>
  <p [class.met]="requirements.specialCharacter" role="listitem">
    <ion-icon [name]="requirements.specialCharacter ? 'checkmark-circle' : 'ellipse-outline'" aria-hidden="true"></ion-icon>
    Un caractère spécial
  </p>
</div>
