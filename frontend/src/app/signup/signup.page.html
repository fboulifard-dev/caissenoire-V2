  <section align=center>
    <p align="right" >
      <ion-button fill="clear"  routerLink="/login">
          Se connecter
        </ion-button>
    </p>

      
    <img class="logo" align=center src="assets/image/logo-asptt-grande.png" alt="ASPTT" />
  </section>
  <section class="ion-padding">
    <p >
      <ion-text color="secondary">
        Créer un compte
      </ion-text>
    </p>
  <ion-item>
    <ion-icon name="person-outline" slot="start"></ion-icon>
    <ion-input
      type="email"
      name="email"
      [(ngModel)]="email"
      #emailModel="ngModel"
      placeholder="Email"
      required>
    </ion-input>
  </ion-item>
  <p class="field-error" *ngIf="(emailModel.dirty || emailModel.touched) && !isEmailValid">
    {{ email.trim() ? 'Saisissez une adresse email valide.' : 'L’adresse email est obligatoire.' }}
  </p>

  <ion-item>
        <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
    <ion-input
      type="password"
      name="password"
      [(ngModel)]="password"
      #passwordModel="ngModel"
      placeholder="Mot de passe"
      required>
    </ion-input>
  </ion-item>
  <p class="field-error" *ngIf="(passwordModel.dirty || passwordModel.touched) && password.length < 6">
    Le mot de passe doit contenir au moins 6 caractères.
  </p>

  <ion-item>
    <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
    <ion-input
      type="password"
      name="confirmPassword"
      [(ngModel)]="confirmPassword"
      #confirmPasswordModel="ngModel"
      placeholder="Confirmation du mot de passe"
      required>
    </ion-input>
  </ion-item>
  <p class="field-error" *ngIf="(confirmPasswordModel.dirty || confirmPasswordModel.touched) && password !== confirmPassword">
    Les mots de passe ne correspondent pas.
  </p>

  <ion-text color="danger" *ngIf="error">
    <p>{{ error }}</p>
  </ion-text>

  <ion-button expand="block" (click)="createAccount()" [disabled]="loading || !canCreateAccount">
    Créer
  </ion-button>
  </section>
  <section>
    <ion-button expand="block" fill="clear"></ion-button>
  </section>
