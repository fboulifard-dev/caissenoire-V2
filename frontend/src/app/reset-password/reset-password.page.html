<ion-content class="auth-content">
  <main class="auth-shell">
    <nav class="auth-topbar" aria-label="Navigation du compte">
      <ion-button fill="clear" routerLink="/login" [disabled]="loading">Retour à la connexion</ion-button>
    </nav>
    <header class="auth-brand">
      <img class="auth-logo" src="assets/image/logo-asptt-grande.png" alt="ASPTT Nantes Handball" />
      <div>
        <span>ASPTT NANTES HB</span>
        <strong>CAISSE NOIRE</strong>
      </div>
    </header>
    <section class="auth-form">
      <div class="auth-intro">
        <h1>Nouveau mot de passe</h1>
        <p *ngIf="linkValid">Choisissez un nouveau mot de passe pour votre compte.</p>
      </div>
      <ion-spinner *ngIf="loading && !linkValid" name="crescent" aria-label="Vérification du lien"></ion-spinner>
      <form *ngIf="linkValid" (ngSubmit)="submit()">
        <div class="auth-fields">
          <ion-item>
            <ion-icon name="lock-closed-outline" slot="start" aria-hidden="true"></ion-icon>
            <ion-input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password"
              label="Nouveau mot de passe" labelPlacement="stacked" autocomplete="new-password" enterkeyhint="send" required></ion-input>
            <ion-button slot="end" fill="clear" type="button" [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
              [attr.aria-pressed]="showPassword" (click)="showPassword = !showPassword">
              <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </ion-button>
          </ion-item>
          <app-password-requirements [password]="password"></app-password-requirements>
          <ion-item>
            <ion-icon name="lock-closed-outline" slot="start" aria-hidden="true"></ion-icon>
            <ion-input [type]="showConfirmPassword ? 'text' : 'password'" name="confirmPassword" [(ngModel)]="confirmPassword"
              label="Confirmer le mot de passe" labelPlacement="stacked" autocomplete="new-password" enterkeyhint="send" required></ion-input>
            <ion-button slot="end" fill="clear" type="button" [attr.aria-label]="showConfirmPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
              [attr.aria-pressed]="showConfirmPassword" (click)="showConfirmPassword = !showConfirmPassword">
              <ion-icon [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </ion-button>
          </ion-item>
          <ion-text color="danger" *ngIf="confirmPassword && password !== confirmPassword">
            <p role="alert">Les mots de passe ne correspondent pas.</p>
          </ion-text>
        </div>
        <ion-button class="auth-primary" expand="block" type="submit" [disabled]="loading || !canSubmit">
          <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
          <span *ngIf="!loading">Valider</span>
        </ion-button>
      </form>
      <ion-text color="danger" *ngIf="error">
        <p class="auth-error" role="alert">{{ error }}</p>
      </ion-text>
      <ion-button *ngIf="error && !linkValid && !linkInvalid && !completed" fill="clear" expand="block" (click)="checkLink()" [disabled]="loading">
        Réessayer
      </ion-button>
    </section>
  </main>
</ion-content>
