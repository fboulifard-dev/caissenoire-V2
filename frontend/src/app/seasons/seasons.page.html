<section align=center>
    <p align="right" >
      <ion-button fill="clear"  routerLink="/signup">
          {{userName}}
        </ion-button>
    </p>

      
    <img class="logo" align=center src="assets/image/logo-asptt-grande.png" alt="ASPTT" />
  </section>
  

  <section class="ion-padding season-content">
    <p >
      <ion-text color="secondary">
        Choisir une saison
      </ion-text>
      </p>
    <div *ngIf="!loading" class="season-cards">
      <ion-card
        *ngFor="let season of seasons"
        button="true"
        (click)="openSeason(season)"
        [class.inactive-season]="!season.active">
        <ion-card-content>
          <h2>{{ season.name || (season.active ? 'Saison active' : 'Saison archivée') }}</h2>
          <ion-badge [color]="season.active ? 'success' : 'medium'">
            {{ season.active ? 'Active' : 'Lecture seule' }}
          </ion-badge>
          <ion-icon name="chevron-forward-outline" aria-hidden="true"></ion-icon>
        </ion-card-content>
      </ion-card>
    </div>
    <ion-spinner *ngIf="loading"></ion-spinner>
    <ion-text color="danger" *ngIf="error"><p>{{ error }}</p></ion-text>
    </section>
    <section class="ion-padding">
      <ion-button expand="block" color="danger" class="logout-button" (click)="logout()">
        <ion-icon name="log-out-outline" slot="start"></ion-icon>
        Déconnexion
      </ion-button>
      <ion-text color="medium" class="app-version">v{{ appVersion }}</ion-text>
  </section>
